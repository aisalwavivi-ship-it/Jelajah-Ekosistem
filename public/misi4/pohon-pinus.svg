<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%">
  <defs>
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="40%" stop-color="#78350f" />
      <stop offset="80%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="pineDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#166534" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="pineMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="45%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="pineLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="60%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="treeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#treeShadow)">
    <!-- Back Tree Left -->
    <g transform="translate(15, 20) scale(0.65)">
      <rect x="52" y="150" width="16" height="45" fill="url(#trunkGrad)" rx="2" />
      <!-- Tier 4 -->
      <path d="M60 70 L20 160 Q60 170 100 160 Z" fill="url(#pineDark)" />
      <!-- Tier 3 -->
      <path d="M60 50 L25 125 Q60 135 95 125 Z" fill="url(#pineMid)" />
      <!-- Tier 2 -->
      <path d="M60 30 L32 90 Q60 98 88 90 Z" fill="url(#pineMid)" />
      <!-- Tier 1 Top -->
      <path d="M60 10 L40 55 Q60 62 80 55 Z" fill="url(#pineLight)" />
    </g>

    <!-- Back Tree Right -->
    <g transform="translate(140, 25) scale(0.68)">
      <rect x="52" y="150" width="16" height="45" fill="url(#trunkGrad)" rx="2" />
      <path d="M60 70 L20 160 Q60 170 100 160 Z" fill="url(#pineDark)" />
      <path d="M60 50 L25 125 Q60 135 95 125 Z" fill="url(#pineMid)" />
      <path d="M60 30 L32 90 Q60 98 88 90 Z" fill="url(#pineMid)" />
      <path d="M60 10 L40 55 Q60 62 80 55 Z" fill="url(#pineLight)" />
    </g>

    <!-- Mid Tree Left-Center -->
    <g transform="translate(45, 10) scale(0.82)">
      <rect x="51" y="150" width="18" height="50" fill="url(#trunkGrad)" rx="2" />
      <path d="M60 70 L15 165 Q60 176 105 165 Z" fill="url(#pineDark)" />
      <path d="M60 48 L22 130 Q60 140 98 130 Z" fill="url(#pineMid)" />
      <path d="M60 28 L30 92 Q60 100 90 92 Z" fill="url(#pineMid)" />
      <path d="M60 8 L38 56 Q60 64 82 56 Z" fill="url(#pineLight)" />
    </g>

    <!-- Mid Tree Far Right -->
    <g transform="translate(170, 35) scale(0.62)">
      <rect x="52" y="150" width="16" height="45" fill="url(#trunkGrad)" rx="2" />
      <path d="M60 70 L20 160 Q60 170 100 160 Z" fill="url(#pineDark)" />
      <path d="M60 50 L25 125 Q60 135 95 125 Z" fill="url(#pineMid)" />
      <path d="M60 30 L32 90 Q60 98 88 90 Z" fill="url(#pineMid)" />
      <path d="M60 10 L40 55 Q60 62 80 55 Z" fill="url(#pineLight)" />
    </g>

    <!-- Front Center Main Tree (Populasi Pinus) -->
    <g transform="translate(95, 0) scale(0.95)">
      <rect x="50" y="145" width="20" height="55" fill="url(#trunkGrad)" rx="3" />
      <!-- Layered textured tiers -->
      <path d="M60 70 L10 165 C35 174, 85 174, 110 165 Z" fill="url(#pineDark)" />
      <path d="M60 45 L18 128 C40 136, 80 136, 102 128 Z" fill="url(#pineMid)" />
      <path d="M60 25 L26 88 C44 95, 76 95, 94 88 Z" fill="url(#pineMid)" />
      <path d="M60 5 L35 50 C48 56, 72 56, 85 50 Z" fill="url(#pineLight)" />
      
      <!-- Needle branch textures -->
      <path d="M30 155 Q60 165 90 155" stroke="#14532d" stroke-width="2" fill="none" opacity="0.4" />
      <path d="M35 120 Q60 128 85 120" stroke="#14532d" stroke-width="2" fill="none" opacity="0.4" />
      <path d="M40 82 Q60 88 80 82" stroke="#166534" stroke-width="1.5" fill="none" opacity="0.4" />
    </g>
  </g>
</svg>
